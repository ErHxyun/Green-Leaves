services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: greenleaves
      POSTGRES_USER: greenleaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenleaves -d greenleaves"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://greenleaves:${POSTGRES_PASSWORD}@postgres:5432/greenleaves
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in root .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      PUBLIC_CHAT_ENABLED: ${PUBLIC_CHAT_ENABLED:-true}
      PUBLIC_CHAT_DAILY_LIMIT: ${PUBLIC_CHAT_DAILY_LIMIT:-50}
      UPLOAD_DIR: /app/backend/uploads
      PORT: 8080
    volumes:
      - media_uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  media_uploads:
